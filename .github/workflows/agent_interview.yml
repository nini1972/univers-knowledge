name: Agent Wishlist Live Interview

on:
  workflow_dispatch: # Manual trigger only (Actions tab -> "Agent Wishlist Live Interview" -> Run workflow)

jobs:
  interview-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: autonomous-student-${{ github.ref }} # never overlaps with the nightly student run
      cancel-in-progress: false
    permissions:
      contents: write # to commit the refreshed AGENT_WISHLIST.md

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Run Live Agent Interviews
        run: |
          set -euo pipefail
          python scripts/consult_professor.py wishlist --live
        env:
          PYTHONPATH: src
          PYTHONUNBUFFERED: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          OPENROUTER_MODEL_STUDENT: ${{ secrets.OPENROUTER_MODEL_STUDENT }}
          OPENROUTER_MODEL_RESEARCHER: ${{ secrets.OPENROUTER_MODEL_RESEARCHER }}
          OPENROUTER_MODEL_SKEPTIC: ${{ secrets.OPENROUTER_MODEL_SKEPTIC }}
          OPENROUTER_MODEL_MATH: ${{ secrets.OPENROUTER_MODEL_MATH }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}

      - name: Commit Refreshed Wishlist
        run: |
          set -euo pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add knowledge_base/AGENT_WISHLIST.md
          git diff --staged --quiet && exit 0
          git commit -m "docs: live agent wishlist interviews (production models)"
          git pull --rebase
          git push
