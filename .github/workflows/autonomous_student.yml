name: Autonomous Student Workflow

on:
  schedule:
    # Runs every day at midnight (UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  run-student-agent:
    runs-on: ubuntu-latest
    concurrency:
      group: autonomous-student-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write # Needed to push new knowledge base files back to the repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip cache purge || true
          pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir -U ddgs
          python -c "from ddgs import DDGS; print('ddgs import ok')"

      - name: Print Runtime Diagnostics
        run: |
          echo "Commit: $(git rev-parse HEAD)"
          python -V
          sed -n '1,80p' src/agents/universe_agents.py

      - name: Execute Knowledge Gathering (Level 1)
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "::error::OPENAI_API_KEY is empty or missing in repository secrets."
            exit 1
          fi
          python src/main.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          PYTHONUNBUFFERED: "1"
          ENABLE_GENMEDIA: "true"

      - name: Execute Advanced Frameworks (Level 2)
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "::error::OPENAI_API_KEY is empty or missing in repository secrets."
            exit 1
          fi
          python src/main_level2.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          PYTHONUNBUFFERED: "1"
          ENABLE_GENMEDIA: "true"

      - name: Verify Generated Images
        run: |
          if [ -d "knowledge_base/images" ]; then
            COUNT=$(find knowledge_base/images -maxdepth 1 -type f | wc -l)
            echo "Generated image file count: ${COUNT}"
            echo "Latest image files:"
            ls -lt knowledge_base/images | head -n 10
          else
            echo "No knowledge_base/images directory found."
          fi

      - name: Commit and Push Knowledge Base Updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add knowledge_base/
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "docs: Student agent acquired new verified knowledge \ud83e\udde0"
          git push
