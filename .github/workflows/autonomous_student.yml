name: Autonomous Student Workflow

on:
  schedule:
    # Runs every day at midnight (UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  run-student-agent:
    runs-on: ubuntu-latest
    concurrency:
      group: autonomous-student-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write # Needed to push new knowledge base files back to the repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Required Secrets
        run: |
          set -euo pipefail
          MISSING=""
          [ -z "${OPENAI_API_KEY:-}" ] && MISSING="$MISSING OPENAI_API_KEY"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secrets:$MISSING"
            exit 1
          fi
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip cache purge || true
          pip install --no-cache-dir -r requirements.txt
          python -c "from ddgs import DDGS; print('ddgs import ok')"

      - name: Print Runtime Diagnostics
        run: |
          set -euo pipefail
          echo "Commit: $(git rev-parse HEAD)"
          python -V
          sed -n '1,80p' src/agents/universe_agents.py

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build Linux Genmedia Binary
        run: |
          set -euo pipefail
          mkdir -p .mcp-servers
          git clone --depth=1 https://github.com/GoogleCloudPlatform/vertex-ai-creative-studio /tmp/vertex-ai-creative-studio
          cd /tmp/vertex-ai-creative-studio/experiments/mcp-genmedia/mcp-genmedia-go
          go build -o "$GITHUB_WORKSPACE/.mcp-servers/mcp-nanobanana-go" ./mcp-nanobanana-go/
          chmod +x "$GITHUB_WORKSPACE/.mcp-servers/mcp-nanobanana-go"
          ls -l "$GITHUB_WORKSPACE/.mcp-servers"

      - name: Configure Google ADC (Genmedia)
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${GCP_SA_KEY}" ]; then
            echo "::warning::GCP_SA_KEY is not set. Genmedia may fail with missing ADC credentials."
          else
            CRED_PATH="$RUNNER_TEMP/gcp-sa.json"
            printf '%s' "${GCP_SA_KEY}" > "$CRED_PATH"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$CRED_PATH" >> "$GITHUB_ENV"
          fi

          if [ -n "${GCP_PROJECT_ID}" ]; then
            echo "GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID}" >> "$GITHUB_ENV"
            echo "PROJECT_ID=${GCP_PROJECT_ID}" >> "$GITHUB_ENV"
          fi

      - name: Execute Knowledge Gathering (Level 1)
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "::error::OPENAI_API_KEY is empty or missing in repository secrets."
            exit 1
          fi
          python src/main.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          PYTHONUNBUFFERED: "1"
          ENABLE_GENMEDIA: "true"

      - name: Execute Advanced Frameworks (Level 2)
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "::error::OPENAI_API_KEY is empty or missing in repository secrets."
            exit 1
          fi
          python src/main_level2.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          PYTHONUNBUFFERED: "1"
          ENABLE_GENMEDIA: "true"

      - name: Verify Generated Images
        run: |
          set -euo pipefail
          if [ -d "knowledge_base/images" ]; then
            COUNT=$(find knowledge_base/images -maxdepth 1 -type f | wc -l)
            echo "Generated image file count: ${COUNT}"
            echo "Latest image files:"
            ls -lt knowledge_base/images | head -n 10
          else
            echo "No knowledge_base/images directory found."
          fi

      - name: Commit and Push Knowledge Base Updates
        run: |
          set -euo pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add knowledge_base/
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "docs: Student agent acquired new verified knowledge \ud83e\udde0"
          git push
